<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>تسجيل الدخول | صوتك</title>
    <link rel="icon" href="../../logo.jpeg" />

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="login-page">
      <div class="login-box">
        <img src="../../logo.jpeg" alt="صوتك" class="logo" />

        <h1>تسجيل الدخول</h1>

        <p>سجل الدخول إلى حسابك في صوتك</p>

        <form method="post">
          <label for="email"> البريد الإلكتروني </label>

          <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" />

          <label for="password"> كلمة المرور </label>

          <input type="password" id="password" placeholder="أدخل كلمة المرور" />

          <button type="submit">تسجيل الدخول</button>

          <div class="no-account">
            <span>ليس لديك حساب؟</span>

            <span class="disabled"> التسجيل غير متاح حاليًا </span>
          </div>
        </form>

        <a href="../../index.html" class="back"> العودة إلى الصفحة الرءيسية </a>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
